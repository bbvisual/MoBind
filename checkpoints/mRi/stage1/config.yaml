experiment:
  name: stage1
  seed: 1201
  output_dir: ./outputs/${experiment.name}
  precision: amp
  device: cuda
wandb:
  enabled: true
  project: MoBind
  config:
    experiment: ${experiment}
    data: ${data}
    model: ${model}
    optimizer: ${optimizer}
    training: ${training}
    distributed: ${distributed}
# Set DATA_ROOT in configs/config.py; root_dir should be DATA_ROOT/mRi
data:
  root_dir: /path/to/datasets/mRi
  window_sec: 5
  stride_sec: 2
  split: subject
  imu_srate: 50
  motion_srate: 10
  motion_type: wjoint
  multi_sensor: false
  dataset_name: mRi
  loader:
    batch_size: 1356
    num_workers: 8
    pin_memory: true
model:
  imu_encoder: conv_former
  imu_channels: 7
  motion_encoder: conv_former
  motion_channels: 6
  num_blocks: 4
  num_heads: 8
  patch_sec: 0.2
  embedding_size: 256
optimizer:
  opt: adam
  lr: 0.0003
  weight_decay: 0.0001
training:
  epochs: 10000
  log_interval: 25
  val_interval: 1
  local_weight: 0.5
  global_weight: 1.0
  early_stopping:
    patience: 1000
    min_delta: 0.001
    mode: max
distributed:
  backend: nccl
  gpus:
  - 0
