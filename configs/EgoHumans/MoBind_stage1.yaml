# ========== Experiment identity ==========
experiment:
  name: "stage1"
  seed: 1201
  output_dir: "./outputs/${experiment.name}"
  precision: "amp"  # ["amp", "amp_bf16", "amp_bfloat16", "bf16", "fp16", "pure_bf16", "pure_fp16", "fp32"]

# ==========  Logging ==========
wandb:
  enabled: true
  project: "MoBind"
  config:
    experiment: ${experiment}
    data: ${data}
    model: ${model}
    optimizer: ${optimizer}
    training: ${training}
    distributed: ${distributed}

# ==========  Data ==========
# Set DATA_ROOT in configs/config.py, then root_dir = DATA_ROOT/EgoHumans
data:
  root_dir: "/path/to/datasets/EgoHumans"
  window_sec: 5
  stride_sec: 2
  split: action
  imu_srate: 20
  motion_srate: 20
  motion_type: "wjoint"
  multi_sensor: false
  dataset_name: EgoHumans

  loader:
    batch_size: 1356
    num_workers: 8
    pin_memory: true


# ==========  Model ==========
model:
  imu_encoder: "conv_former"
  imu_channels: 7
  motion_encoder: "conv_former"
  motion_channels: 6                  # 3 2D joints
  num_blocks: 4
  num_heads: 8
  patch_sec: 0.2
  embedding_size: 256

# ==========  Optimiser ==========
optimizer:
  opt: "adam"            # ["adam", "adamw"]
  lr: 1e-4
  weight_decay: 1e-4

# ==========  Training loop ==========
training:
  epochs: 10000
  log_interval: 25
  val_interval: 1
  local_weight: 0.5
  global_weight: 1.0
  early_stopping:
    patience: 1000
    min_delta: 0.001
    mode: "max"

# ==========  Hardware / distributed ==========
distributed:
  backend: "nccl"
  gpus: [0]
